- name: catalogue
  hosts: catalogue
  become: yes
  tasks:
    - name: Disable current module # if module is not available then use shell cmd 
      ansible.builtin.command: dnf module disable nodejs -y 
    - name: Enable nodejs 20 module
      ansible.builtin.command: dnf module enable nodejs:20 -y
    - name: Install NodeJS
      ansible.builtin.package:
        name: nodejs 
        state: present
    - name: create roboshop user
      ansible.builtin.user:
        name: roboshop
    - name: create app directory
      ansible.builtin.file:
        path: /app 
        state: directory # directory otherwise it will create a file
    - name: Download the catalogue application
      ansible.builtin.get_url:
        url: https://roboshop-artifacts.s3.amazonaws.com/catalogue-v3.zip
        dest: /tmp/catalogue.zip
    - name: unzip catalogue app
      ansible.builtin.unarchive:
      src: /tmp/catalogue.zip
      dest: /app
      remote_src: yes
