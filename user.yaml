- name: user
  hosts: user
  become: yes
  tasks:
    - name: Disable current module # if module is not available then use shell cmd 
      ansible.builtin.command: dnf module disable nodejs -y 
    - name: Enable nodejs 20 module
      ansible.builtin.command: dnf module enable nodejs:20 -y
    - name: Install NodeJS
      ansible.builtin.package:
        name: nodejs 
        state: present
    - name: create roboshop user
      ansible.builtin.user:
        name: roboshop
      # remove a directory if already exists 
    - name: Recursively remove app directory and its contents
      ansible.builtin.file:
        path: /app
        state: absent
    - name: create app directory
      ansible.builtin.file:
        path: /app 
        state: directory # directory otherwise it will create a file
    - name: Download user application
      ansible.builtin.get_url:
        url: https://roboshop-artifacts.s3.amazonaws.com/user-v3.zip
        dest: /tmp/user.zip
    - name: unzip user app
      ansible.builtin.unarchive:
        src: /tmp/user.zip
        dest: /app
        remote_src: yes
    - name: install dependencies
      ansible.builtin.command: npm install
      args:
        chdir: /app 
    - name: copy user Service
      ansible.builtin.copy:
        src: user.service
        dest: /etc/systemd/system/user.service
    - name: Run daemon-reload only
      ansible.builtin.systemd_service:
        daemon_reload: true
   
    - name: Start and Enable user Service
      ansible.builtin.service:
        name: user
        state: started
        enabled: true
